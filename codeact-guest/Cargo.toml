[workspace]

[package]
name = "codeact-guest"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "codeact-guest"
path = "src/main.rs"

[dependencies]
rquickjs = { version = "0.12", default-features = false, features = ["std"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
