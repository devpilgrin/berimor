[package]
name = "berimor-tool-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MCP-клиент/сервер и изоляция плагина как процесса."

[dependencies]
berimor-capability = { path = "../berimor-capability" }
berimor-types = { path = "../berimor-types" }
rmcp = { version = "3.0.1", features = ["client", "server", "transport-child-process", "transport-io", "macros", "schemars"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1.53.1", features = ["process", "io-util", "rt", "macros"] }
