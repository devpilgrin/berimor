[package]
name = "berimor-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Точка входа Berimor: CLI, конфигурация, оркестрация подкоманд."

[[bin]]
name = "berimor"
path = "src/main.rs"

[[bin]]
name = "cli_mcp_echo_server"
path = "src/bin/cli_mcp_echo_server.rs"

[dependencies]
berimor-capability = { path = "../berimor-capability" }
berimor-context-engine = { path = "../berimor-context-engine" }
berimor-eval = { path = "../berimor-eval" }
berimor-executors = { path = "../berimor-executors" }
berimor-memory = { path = "../berimor-memory" }
berimor-model-pool = { path = "../berimor-model-pool" }
berimor-process-engine = { path = "../berimor-process-engine" }
berimor-secrets = { path = "../berimor-secrets" }
berimor-storage = { path = "../berimor-storage" }
berimor-tool-runtime = { path = "../berimor-tool-runtime" }
berimor-types = { path = "../berimor-types" }
clap = { version = "4", features = ["derive"] }
rmcp = { version = "3.0.1", features = ["client", "server", "transport-child-process", "transport-io"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
semver = "1"
serde = { workspace = true, features = ["derive"] }
sigstore = { version = "0.14", default-features = false, features = ["bundle", "sigstore-trust-root", "rustls-tls"] }
const-oid = "0.9"
dirs = "6"
x509-cert = "0.2"
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1.53.1", features = ["process", "io-util", "rt"] }
toml = "1.1.4"
