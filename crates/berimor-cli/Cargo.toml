[package]
name = "berimor-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Точка входа Berimor: CLI, конфигурация, оркестрация подкоманд."

[[bin]]
name = "berimor"
path = "src/main.rs"

[dependencies]
berimor-types = { path = "../berimor-types" }
clap = { version = "4", features = ["derive"] }
