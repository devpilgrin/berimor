[package]
name = "berimor-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Точка входа Berimor: CLI, конфигурация, оркестрация подкоманд."

[[bin]]
name = "berimor"
path = "src/main.rs"

[[bin]]
name = "cli_mcp_echo_server"
path = "src/bin/cli_mcp_echo_server.rs"

[dependencies]
libc = "0.2"
berimor-capability = { path = "../berimor-capability" }
berimor-context-engine = { path = "../berimor-context-engine" }
berimor-eval = { path = "../berimor-eval" }
berimor-executors = { path = "../berimor-executors" }
berimor-mediation = { path = "../berimor-mediation" }
berimor-memory = { path = "../berimor-memory" }
berimor-model-pool = { path = "../berimor-model-pool" }
berimor-process-engine = { path = "../berimor-process-engine" }
berimor-secrets = { path = "../berimor-secrets" }
berimor-storage = { path = "../berimor-storage" }
berimor-tool-runtime = { path = "../berimor-tool-runtime" }
berimor-types = { path = "../berimor-types" }
clap = { version = "4", features = ["derive"] }
rmcp = { version = "3.0.1", features = ["client", "server", "transport-child-process", "transport-io"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
semver = "1"
serde = { workspace = true, features = ["derive"] }
sigstore = { version = "0.14", default-features = false, features = ["bundle", "sigstore-trust-root", "rustls-tls"] }
const-oid = "0.9"
dirs = "6"
x509-cert = "0.2"
serde_json.workspace = true
thiserror.workspace = true
# OAuth subscription login (ADR-0027, ROADMAP §20.25): PKCE S256 + state.
# Все три уже в Cargo.lock транзитивно — новых внешних зависимостей нет.
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
# Волны встроенных инструментов A/B/C (docs/rnd/builtin-tools-waves-spec.md):
# files.search. Все три уже в Cargo.lock транзитивно — нового внешнего
# кода нет (конвенция: grep по локфайлу до добавления).
walkdir = "2.5.0"
regex = "1.13.1"
globset = "0.4.19"
tokio = { version = "1.53.1", features = ["process", "io-util", "rt"] }
toml = "1.1.4"
ratatui = "0.30"
crossterm = "0.29"

[features]
# Локальный инференс GGUF через llama.cpp (ROADMAP E4, ADR-0024) —
# opt-in: сборка C++ ядра занимает минуты.
local-inference = ["berimor-model-pool/local-inference"]
# Семантическая близость памяти на эмбеддингах (ROADMAP §20.23) —
# opt-in: fastembed (ONNX Runtime) + скачивание модели ~0.5 ГБ при первом
# использовании. Включает `[memory] embeddings = true` в конфигурации.
embeddings = ["berimor-memory/embeddings"]
