[package]
name = "berimor-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Точка входа Berimor: CLI, конфигурация, оркестрация подкоманд."

[[bin]]
name = "berimor"
path = "src/main.rs"

[dependencies]
berimor-capability = { path = "../berimor-capability" }
berimor-context-engine = { path = "../berimor-context-engine" }
berimor-executors = { path = "../berimor-executors" }
berimor-model-pool = { path = "../berimor-model-pool" }
berimor-process-engine = { path = "../berimor-process-engine" }
berimor-secrets = { path = "../berimor-secrets" }
berimor-storage = { path = "../berimor-storage" }
berimor-types = { path = "../berimor-types" }
clap = { version = "4", features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
toml = "1.1.4"
