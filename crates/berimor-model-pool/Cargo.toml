[package]
name = "berimor-model-pool"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Реестр моделей, классы способностей, селектор провайдера по стоимости/латентности."

[dependencies]
berimor-capability = { path = "../berimor-capability" }
berimor-secrets = { path = "../berimor-secrets" }
berimor-types = { path = "../berimor-types" }
serde = { workspace = true }
serde_json.workspace = true
# rustls вместо OpenSSL — без системной зависимости (stack.md §2, I5).
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
# Биндинги llama.cpp (ROADMAP E4, ADR-0024) — за feature-флагом: сборка
# C++ ядра занимает минуты и не должна быть ценой каждой сборки и CI.
# Провайдер без флага компилируется полностью (клей, тесты на фейковом
# движке), реальный бэкенд — только с `local-inference`.
llama-cpp-2 = { version = "0.1", optional = true, features = ["common"] }
# Потоковый UTF-8-декодер для token_to_piece (кусок токена может резать
# многобайтовый символ — собирать строку из байтов напрямую нельзя).
encoding_rs = { version = "0.8", optional = true }

[features]
local-inference = ["dep:llama-cpp-2", "dep:encoding_rs"]
