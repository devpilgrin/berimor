[package]
name = "berimor-actors"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Модель актора, диспетчер, планировщик — мультиагентность без маршрутизации моделью."

[dependencies]
berimor-storage = { path = "../berimor-storage" }
berimor-types = { path = "../berimor-types" }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1", features = ["sync", "time", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "test-util"] }
