name: Release

# Триггер — push тега `v*`, не release.published: GitHub Immutable Releases
# запрещает добавлять ассеты к уже опубликованному релизу (HTTP 422
# «Cannot upload assets to an immutable release» — обнаружено на первом
# реальном прогоне этого пайплайна, не в теории). Значит релиз обязан
# создаваться ОДНИМ атомарным шагом, уже со всеми артефактами приложенными,
# а не «создать релиз → потом дозалить ассеты по одному на платформу».
#
# Отсюда и структура: build — только собирает и складывает в workflow
# artifacts (`actions/upload-artifact`), publish — единственный, кто
# реально создаёт релиз, после того как все платформы собраны.
#
# workflow_dispatch с необязательным `tag` — чтобы вручную прогнать
# сборку+публикацию под уже существующий тег (например, если release.yml
# поправили и нужно доизготовить релиз для тега, у которого push уже
# состоялся раньше и повторно не произойдёт).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег для сборки/публикации (например v0.1.0). Пусто — только сборка, без публикации релиза."
        required: false
        type: string

jobs:
  build:
    name: ${{ matrix.target }}
    # contents: read — сборка/упаковка/upload-artifact не пишут в
    # репозиторий, contents: write нужен только publish, где реально
    # создаётся релиз — не всей workflow заранее. id-token: write — это
    # ЕДИНСТВЕННОЕ, что нужно для keyless-подписи cosign (D2, ADR-0026):
    # cosign запрашивает у Fulcio короткоживущий сертификат по OIDC-токену
    # именно этого workflow-запуска, приватный ключ нигде не хранится.
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Нативные раннеры под каждую цель, не кросс-компиляция с одного
          # раннера через cargo-zigbuild (расходится с `docs/arch/stack.md`
          # §9 по этой конкретной детали): у zigbuild нет практической
          # поддержки цели macOS без osxcross и извлечения Apple SDK, что
          # юридически спорно для редистрибуции. Нативный раннер решает ту
          # же задачу — артефакт под каждую платформу — без этого обхода.
          - target: linux-x64
            os: ubuntu-latest
            ext: tar.gz
          - target: linux-arm64
            os: ubuntu-24.04-arm
            ext: tar.gz
          # darwin-x64 (macos-13) снят из матрицы: очередь на этот раннер
          # на практике зависает на десятки минут без начала выполнения
          # (проверено — не гипотеза), а Intel-макросборка не настолько
          # приоритетна, чтобы держать из-за неё весь релиз. Вернуть можно
          # отдельной задачей, когда доступность раннера станет предсказуемой.
          - target: darwin-arm64
            os: macos-latest
            ext: tar.gz
          - target: win32-x64
            os: windows-latest
            ext: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: sigstore/cosign-installer@v3

      - name: resolve version
        shell: bash
        run: echo "VERSION=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_ENV"

      - name: build
        run: cargo build --release -p berimor-cli

      # SBOM (D7, deployment.md §7 стадия 4): cargo-cyclonedx ставится
      # через `cargo install` (компиляция в CI, не готовый бинарник) —
      # сознательно: в репозитории нет прецедента pinned-binary-install
      # экшена, а сборка и так не самая быстрая (кросс-платформенная
      # матрица), лишние секунды не меняют картину. `cargo cyclonedx` без
      # `-p` пишет `<имя-пакета>.cdx.json` РЯДОМ С КАЖДЫМ `Cargo.toml` в
      # workspace (проверено запуском v0.5.9 локально 2026-08-02 — ПРЕЖНИЙ
      # комментарий про `bom.json` был не проверен реальным запуском и
      # ломал релиз на всех 4 платформах одинаково, тег v0.7.0) — берём
      # только тот, что соответствует реально публикуемому бинарнику
      # (`crates/berimor-cli`), остальные (для внутренних библиотечных
      # крейтов) не публикуются. Имя итогового файла включает
      # `matrix.target` — иначе `upload-artifact`/`gh release create`
      # получили бы четыре одинаково названных файла от четырёх платформ.
      - name: generate SBOM (cargo-cyclonedx)
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json
          mv crates/berimor-cli/berimor-cli.cdx.json "berimor-${VERSION}-${{ matrix.target }}.cdx.json"

      # Имя архива — соглашение из bootstrap/src/platform.ts:
      # berimor-<version>-<platform>-<arch>.<tar.gz|zip>, platform/arch —
      # буквально os.platform()/os.arch() в Node.js (win32, не windows).
      - name: package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/berimor dist/berimor
          ARCHIVE="berimor-${VERSION}-${{ matrix.target }}.tar.gz"
          tar -C dist -czf "$ARCHIVE" berimor
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/berimor.exe dist/berimor.exe
          $Archive = "berimor-$env:VERSION-${{ matrix.target }}.zip"
          Compress-Archive -Path dist/berimor.exe -DestinationPath $Archive
          "ARCHIVE=$Archive" | Out-File -Encoding ascii -Append $env:GITHUB_ENV

      # Keyless-подпись (D2, ADR-0026): cosign получает OIDC-токен этого
      # workflow-запуска (id-token: write выше), Fulcio выдаёт короткоживущий
      # сертификат, привязанный к идентичности workflow — не к чьему-то
      # приватному ключу. Бандл (`--bundle`) — один JSON-файл с подписью,
      # сертификатом и записью Rekor; заменяет контрольную сумму, не
      # дополняет её — так и было задумано изначально в этом файле.
      # --new-bundle-format: без него cosign пишет старый ad-hoc формат
      # бандла (`base64Signature`/`cert`/`rekorBundle`), не единую схему
      # Sigstore Bundle v1 — обнаружено на первом реальном прогоне (см.
      # `verify.rs`, который читает именно v1: `serde_json::from_str`
      # спотыкался на незнакомом поле `base64Signature`).
      - name: sign artifact (cosign keyless)
        shell: bash
        run: cosign sign-blob --yes --new-bundle-format --bundle "${ARCHIVE}.sigstore.json" "$ARCHIVE"

      - name: upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            berimor-*.tar.gz
            berimor-*.tar.gz.sigstore.json
            berimor-*.zip
            berimor-*.zip.sigstore.json
            berimor-*.cdx.json
          if-no-files-found: error

  # Маленький подписанный "канарейка"-артефакт — независим от матрицы
  # платформ (одна подпись, не четыре одинаковых), не входит в assets
  # реального релиза (publish его не трогает: не в `needs`, не читает его
  # артефакт). Единственное назначение — дешёвый воспроизводимый пример
  # РЕАЛЬНОЙ keyless-подписи именно этим workflow для golden-фикстур
  # (`fixtures/golden/signing/`, D2) и будущих тестов внедрения сбоев
  # (D8) — без необходимости коммитить в репозиторий полноразмерный
  # платформенный архив ради теста верификации.
  canary:
    name: Sign release canary
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: sigstore/cosign-installer@v3

      - name: resolve version
        shell: bash
        run: echo "VERSION=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_ENV"

      - name: write canary
        shell: bash
        run: |
          printf 'berimor release canary\nversion: %s\ncommit: %s\n' "$VERSION" "$GITHUB_SHA" > RELEASE.txt

      - name: sign canary (cosign keyless)
        shell: bash
        run: cosign sign-blob --yes --new-bundle-format --bundle RELEASE.txt.sigstore.json RELEASE.txt

      - name: upload canary artifact
        uses: actions/upload-artifact@v7
        with:
          name: canary
          path: |
            RELEASE.txt
            RELEASE.txt.sigstore.json
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    # id-token: write — то же основание, что у job build (D2): npm
    # provenance (`npm publish --provenance`, D7) берёт OIDC-токен этого
    # workflow-запуска тем же механизмом, что cosign — не отдельный секрет.
    permissions:
      contents: write
      id-token: write
    # Публикуем только когда есть тег, за который отвечаем: реальный push
    # тега, либо явно указанный tag во ручном запуске. Обычный
    # workflow_dispatch без tag — сборка ради проверки пайплайна, без
    # выпуска релиза (см. artifacts выше — они всё равно скачиваемы).
    if: github.event_name == 'push' || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: resolve tag
        shell: bash
        run: echo "TAG=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      # D7 SBOM для bootstrap: встроенная команда npm ≥9, ноль новых
      # зависимостей. Генерируется ДО `gh release create` и кладётся в
      # `release-assets/`, чтобы попасть в тот же атомарный шаг публикации
      # релиза — GitHub Immutable Releases не даёт дозалить ассет ПОСЛЕ
      # `gh release create` (см. комментарий D1 выше, HTTP 422), поэтому
      # нельзя сгенерировать SBOM позже, вместе с npm publish.
      - name: generate SBOM for bootstrap (npm sbom)
        working-directory: bootstrap
        shell: bash
        run: |
          set -euo pipefail
          # --ignore-scripts: гигиена на свежем чекауте (dist/ ещё не
          # собран); install-скриптов у пакета нет вовсе (убраны 0.24.1 —
          # класс замечаний Socket.dev закрыт структурно, не документацией).
          npm ci --ignore-scripts
          npm sbom --sbom-format cyclonedx > "../release-assets/bootstrap-${TAG#v}.cdx.json"

      - name: create release with all assets attached atomically
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Идемпотентность: релиз уже существует (повторный прогон после
          # падения npm publish — например, смена токена) — пропускаем
          # создание, артефакты приложены первым прогоном; пайплайн идёт
          # дальше к checksums и npm publish. Без этого повторный запуск
          # умирал на «release already exists» и единственным лекарством
          # было жечь следующую версию.
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "релиз $TAG уже существует — пропуск создания (идемпотентный повтор)"
            echo "RELEASE_EXISTED=true" >> "$GITHUB_ENV"
            exit 0
          fi
          gh release create "$TAG" release-assets/* \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --notes "Платформенные артефакты для $TAG. Полное описание релиза — отредактировано отдельно после публикации, если требуется." \
            --verify-tag

      # D3: SHA-256 платформенных архивов пиннится В САМ npm-пакет bootstrap,
      # НЕ в GitHub Release рядом с тем, что эти хэши описывают — иначе
      # первая установка (bootstrap/src/checksums-manifest.ts) сверяла бы
      # скачанный артефакт с хэшем из того же самого источника, который она
      # проверяет, что не даёт защиты (компрометация аккаунта публикации
      # GitHub Release скомпрометирует оба файла разом). Доверие первой
      # установки должно приходить из независимого канала — npm, куда
      # публикация идёт отдельным шагом ниже.
      - name: compute checksums for bootstrap pin
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Повторный прогон при УЖЕ существующем релизе: checksums обязаны
          # быть от артефактов, РЕАЛЬНО приложенных к релизу (первая
          # сборка), а не от пересобранных в этом прогоне — сборки не
          # байт-воспроизводимы, иначе пин в npm-пакете не сойдётся с
          # файлом, который скачает пользователь (поймано на v0.9.0).
          if [ "${RELEASE_EXISTED:-}" = "true" ]; then
            echo "идемпотентный повтор: checksums по артефактам существующего релиза"
            rm -f release-assets/berimor-*.tar.gz release-assets/berimor-*.zip
            gh release download "$TAG" \
              --repo "${{ github.repository }}" \
              --dir release-assets \
              --pattern 'berimor-*.tar.gz' --pattern 'berimor-*.zip' \
              --clobber
          fi
          shopt -s nullglob
          out="bootstrap/checksums.json"
          printf '{\n' > "$out"
          sep=""
          for f in release-assets/berimor-*.tar.gz release-assets/berimor-*.zip; do
            name="$(basename "$f")"
            hex="$(sha256sum "$f" | cut -d' ' -f1)"
            printf '%s  "%s": "%s"' "$sep" "$name" "$hex" >> "$out"
            sep=$',\n'
          done
          printf '\n}\n' >> "$out"
          cat "$out"

      # Требует секрета NPM_TOKEN (Settings → Secrets → Actions) — его в
      # репозитории пока нет (сознательный остаточный пункт D3, см.
      # ROADMAP §14): без него этот шаг упадёт на публикации, сам релиз
      # GitHub (шаг выше) при этом уже успешно создан и не откатывается.
      # `--provenance` (D7): npm подписывает атрибут провенанса тем же
      # OIDC-токеном workflow-запуска, что уже дают `id-token: write` этой
      # job — «проверяемо связывающие артефакт с конкретным коммитом и
      # workflow-запуском» (`deployment.md` §7, стадия 6), тот же принцип,
      # что keyless cosign для платформенных архивов (D2), другим
      # механизмом (npm registry сам проверяет и показывает провенанс, не
      # отдельный `.sigstore.json`-бандл).
      # Страница npmjs.com рендерит README ПАКЕТА: синхронизируем
      # главный README репозитория в bootstrap/ перед публикацией —
      # иначе страница показывает техническую доку установщика и
      # выглядит «без изменений» (замечено пользователем 2026-08-03).
      - name: sync README into npm package
        shell: bash
        run: cp README.md bootstrap/README.md

      - name: publish bootstrap to npm
        working-directory: bootstrap
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npm pkg set version="${TAG#v}"
          # --ignore-scripts: тот же порядок, что и у шага SBOM выше
          # (гигиена; install-скриптов нет с 0.24.1).
          npm ci --ignore-scripts
          npm run build
          npm publish --access public --provenance

# Не входит в этот пайплайн — отдельные задачи ROADMAP:
# D4-D6 — agent-self-update и установка плагина читают собранное здесь.
