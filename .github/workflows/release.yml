name: Release

# Триггер — push тега `v*`, не release.published: GitHub Immutable Releases
# запрещает добавлять ассеты к уже опубликованному релизу (HTTP 422
# «Cannot upload assets to an immutable release» — обнаружено на первом
# реальном прогоне этого пайплайна, не в теории). Значит релиз обязан
# создаваться ОДНИМ атомарным шагом, уже со всеми артефактами приложенными,
# а не «создать релиз → потом дозалить ассеты по одному на платформу».
#
# Отсюда и структура: build — только собирает и складывает в workflow
# artifacts (`actions/upload-artifact`), publish — единственный, кто
# реально создаёт релиз, после того как все платформы собраны.
#
# workflow_dispatch с необязательным `tag` — чтобы вручную прогнать
# сборку+публикацию под уже существующий тег (например, если release.yml
# поправили и нужно доизготовить релиз для тега, у которого push уже
# состоялся раньше и повторно не произойдёт).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег для сборки/публикации (например v0.1.0). Пусто — только сборка, без публикации релиза."
        required: false
        type: string

jobs:
  build:
    name: ${{ matrix.target }}
    # contents: read — сборка/упаковка/upload-artifact не пишут в
    # репозиторий, contents: write нужен только publish, где реально
    # создаётся релиз — не всей workflow заранее. id-token: write — это
    # ЕДИНСТВЕННОЕ, что нужно для keyless-подписи cosign (D2, ADR-0026):
    # cosign запрашивает у Fulcio короткоживущий сертификат по OIDC-токену
    # именно этого workflow-запуска, приватный ключ нигде не хранится.
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Нативные раннеры под каждую цель, не кросс-компиляция с одного
          # раннера через cargo-zigbuild (расходится с `docs/arch/stack.md`
          # §9 по этой конкретной детали): у zigbuild нет практической
          # поддержки цели macOS без osxcross и извлечения Apple SDK, что
          # юридически спорно для редистрибуции. Нативный раннер решает ту
          # же задачу — артефакт под каждую платформу — без этого обхода.
          - target: linux-x64
            os: ubuntu-latest
            ext: tar.gz
          - target: linux-arm64
            os: ubuntu-24.04-arm
            ext: tar.gz
          # darwin-x64 (macos-13) снят из матрицы: очередь на этот раннер
          # на практике зависает на десятки минут без начала выполнения
          # (проверено — не гипотеза), а Intel-макросборка не настолько
          # приоритетна, чтобы держать из-за неё весь релиз. Вернуть можно
          # отдельной задачей, когда доступность раннера станет предсказуемой.
          - target: darwin-arm64
            os: macos-latest
            ext: tar.gz
          - target: win32-x64
            os: windows-latest
            ext: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: sigstore/cosign-installer@v3

      - name: resolve version
        shell: bash
        run: echo "VERSION=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_ENV"

      - name: build
        run: cargo build --release -p berimor-cli

      # Имя архива — соглашение из bootstrap/src/platform.ts:
      # berimor-<version>-<platform>-<arch>.<tar.gz|zip>, platform/arch —
      # буквально os.platform()/os.arch() в Node.js (win32, не windows).
      - name: package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/berimor dist/berimor
          ARCHIVE="berimor-${VERSION}-${{ matrix.target }}.tar.gz"
          tar -C dist -czf "$ARCHIVE" berimor
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/berimor.exe dist/berimor.exe
          $Archive = "berimor-$env:VERSION-${{ matrix.target }}.zip"
          Compress-Archive -Path dist/berimor.exe -DestinationPath $Archive
          "ARCHIVE=$Archive" | Out-File -Encoding ascii -Append $env:GITHUB_ENV

      # Keyless-подпись (D2, ADR-0026): cosign получает OIDC-токен этого
      # workflow-запуска (id-token: write выше), Fulcio выдаёт короткоживущий
      # сертификат, привязанный к идентичности workflow — не к чьему-то
      # приватному ключу. Бандл (`--bundle`) — один JSON-файл с подписью,
      # сертификатом и записью Rekor; заменяет контрольную сумму, не
      # дополняет её — так и было задумано изначально в этом файле.
      # --new-bundle-format: без него cosign пишет старый ad-hoc формат
      # бандла (`base64Signature`/`cert`/`rekorBundle`), не единую схему
      # Sigstore Bundle v1 — обнаружено на первом реальном прогоне (см.
      # `verify.rs`, который читает именно v1: `serde_json::from_str`
      # спотыкался на незнакомом поле `base64Signature`).
      - name: sign artifact (cosign keyless)
        shell: bash
        run: cosign sign-blob --yes --new-bundle-format --bundle "${ARCHIVE}.sigstore.json" "$ARCHIVE"

      - name: upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            berimor-*.tar.gz
            berimor-*.tar.gz.sigstore.json
            berimor-*.zip
            berimor-*.zip.sigstore.json
          if-no-files-found: error

  # Маленький подписанный "канарейка"-артефакт — независим от матрицы
  # платформ (одна подпись, не четыре одинаковых), не входит в assets
  # реального релиза (publish его не трогает: не в `needs`, не читает его
  # артефакт). Единственное назначение — дешёвый воспроизводимый пример
  # РЕАЛЬНОЙ keyless-подписи именно этим workflow для golden-фикстур
  # (`fixtures/golden/signing/`, D2) и будущих тестов внедрения сбоев
  # (D8) — без необходимости коммитить в репозиторий полноразмерный
  # платформенный архив ради теста верификации.
  canary:
    name: Sign release canary
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: sigstore/cosign-installer@v3

      - name: resolve version
        shell: bash
        run: echo "VERSION=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_ENV"

      - name: write canary
        shell: bash
        run: |
          printf 'berimor release canary\nversion: %s\ncommit: %s\n' "$VERSION" "$GITHUB_SHA" > RELEASE.txt

      - name: sign canary (cosign keyless)
        shell: bash
        run: cosign sign-blob --yes --new-bundle-format --bundle RELEASE.txt.sigstore.json RELEASE.txt

      - name: upload canary artifact
        uses: actions/upload-artifact@v7
        with:
          name: canary
          path: |
            RELEASE.txt
            RELEASE.txt.sigstore.json
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    permissions:
      contents: write
    # Публикуем только когда есть тег, за который отвечаем: реальный push
    # тега, либо явно указанный tag во ручном запуске. Обычный
    # workflow_dispatch без tag — сборка ради проверки пайплайна, без
    # выпуска релиза (см. artifacts выше — они всё равно скачиваемы).
    if: github.event_name == 'push' || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: resolve tag
        shell: bash
        run: echo "TAG=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: create release with all assets attached atomically
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/* \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --notes "Платформенные артефакты для $TAG. Полное описание релиза — отредактировано отдельно после публикации, если требуется." \
            --verify-tag

# Не входит в этот пайплайн — отдельные задачи ROADMAP:
# D7 — провенанс и SBOM;
# D4-D6 — agent-self-update и установка плагина читают собранное здесь.
