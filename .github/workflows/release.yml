name: Release

# Триггер — push тега `v*`, не release.published: GitHub Immutable Releases
# запрещает добавлять ассеты к уже опубликованному релизу (HTTP 422
# «Cannot upload assets to an immutable release» — обнаружено на первом
# реальном прогоне этого пайплайна, не в теории). Значит релиз обязан
# создаваться ОДНИМ атомарным шагом, уже со всеми артефактами приложенными,
# а не «создать релиз → потом дозалить ассеты по одному на платформу».
#
# Отсюда и структура: build — только собирает и складывает в workflow
# artifacts (`actions/upload-artifact`), publish — единственный, кто
# реально создаёт релиз, после того как все платформы собраны.
#
# workflow_dispatch с необязательным `tag` — чтобы вручную прогнать
# сборку+публикацию под уже существующий тег (например, если release.yml
# поправили и нужно доизготовить релиз для тега, у которого push уже
# состоялся раньше и повторно не произойдёт).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег для сборки/публикации (например v0.1.0). Пусто — только сборка, без публикации релиза."
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Нативные раннеры под каждую цель, не кросс-компиляция с одного
          # раннера через cargo-zigbuild (расходится с `docs/arch/stack.md`
          # §9 по этой конкретной детали): у zigbuild нет практической
          # поддержки цели macOS без osxcross и извлечения Apple SDK, что
          # юридически спорно для редистрибуции. Нативный раннер решает ту
          # же задачу — артефакт под каждую платформу — без этого обхода.
          - target: linux-x64
            os: ubuntu-latest
            ext: tar.gz
          - target: linux-arm64
            os: ubuntu-24.04-arm
            ext: tar.gz
          # darwin-x64 (macos-13) снят из матрицы: очередь на этот раннер
          # на практике зависает на десятки минут без начала выполнения
          # (проверено — не гипотеза), а Intel-макросборка не настолько
          # приоритетна, чтобы держать из-за неё весь релиз. Вернуть можно
          # отдельной задачей, когда доступность раннера станет предсказуемой.
          - target: darwin-arm64
            os: macos-latest
            ext: tar.gz
          - target: win32-x64
            os: windows-latest
            ext: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: resolve version
        shell: bash
        run: echo "VERSION=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_ENV"

      - name: build
        run: cargo build --release -p berimor-cli

      # Имя архива — соглашение из bootstrap/src/platform.ts:
      # berimor-<version>-<platform>-<arch>.<tar.gz|zip>, platform/arch —
      # буквально os.platform()/os.arch() в Node.js (win32, не windows).
      - name: package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/berimor dist/berimor
          ARCHIVE="berimor-${VERSION}-${{ matrix.target }}.tar.gz"
          tar -C dist -czf "$ARCHIVE" berimor
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/berimor.exe dist/berimor.exe
          $Archive = "berimor-$env:VERSION-${{ matrix.target }}.zip"
          Compress-Archive -Path dist/berimor.exe -DestinationPath $Archive
          (Get-FileHash $Archive -Algorithm SHA256).Hash.ToLower() + "  $Archive" | Out-File -Encoding ascii "$Archive.sha256"

      # Контрольная сумма — не замена подписи, только целостность на время,
      # пока не сделан ROADMAP D2 (sigstore/cosign, keyless). Заменится, не
      # дополнится: цель — одна подпись, привязанная к идентичности CI
      # (ADR-0026), а не отдельный параллельный механизм.
      - name: upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            berimor-*.tar.gz
            berimor-*.tar.gz.sha256
            berimor-*.zip
            berimor-*.zip.sha256
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    # Публикуем только когда есть тег, за который отвечаем: реальный push
    # тега, либо явно указанный tag во ручном запуске. Обычный
    # workflow_dispatch без tag — сборка ради проверки пайплайна, без
    # выпуска релиза (см. artifacts выше — они всё равно скачиваемы).
    if: github.event_name == 'push' || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: resolve tag
        shell: bash
        run: echo "TAG=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: create release with all assets attached atomically
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/* \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --notes "Платформенные артефакты для $TAG. Полное описание релиза — отредактировано отдельно после публикации, если требуется." \
            --verify-tag

# Не входит в этот пайплайн — отдельные задачи ROADMAP:
# D2 — подпись sigstore/cosign (keyless, ADR-0026) вместо/вместе с sha256;
# D7 — провенанс и SBOM;
# D4-D6 — agent-self-update и установка плагина читают собранное здесь.
