name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Ручной запуск — диагностика «пуш не поднял CI» (2026-08-03: шесть
  # пушей подряд не породили запусков, CodeQL при этом шёл) и проверка
  # веток без PR.
  workflow_dispatch:
  # Полная матрица — по расписанию (консолидация CI, 2026-08-05):
  # каждый пуш — только ubuntu (быстрый сигнал), платформенная
  # специфика ловится weekly-прогоном и релизной матрицей release.yml.
  schedule:
    - cron: "0 3 * * 1" 

# Только чтение — ни одна из джоб этого workflow не пишет в репозиторий
# (fmt/clippy/test/build), в отличие от release.yml, где publish отдельно
# поднимает права до contents: write только там, где это реально нужно.
permissions:
  contents: read

jobs:
  rust:
    name: Rust · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Консолидация CI (2026-08-05, решение пользователя): пуши/PR —
        # только ubuntu (часовые пояса не жгут); полная матрица — по
        # расписанию (weekly) и в релизном пайплайне.
        os: ${{ github.event_name == 'schedule' && fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace

  bootstrap:
    name: Bootstrap (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: bootstrap/package-lock.json
      - name: install (без postinstall — dist ещё не собран)
        working-directory: bootstrap
        run: npm install --ignore-scripts
      - name: build
        working-directory: bootstrap
        run: npm run build
      - name: test
        working-directory: bootstrap
        run: npm test

# Этот workflow — только проверка кода на push/PR (fmt/clippy/test).
# Сборка платформенных артефактов (D1) — release.yml, запускается публикацией
# релиза. Подпись (D2, sigstore/cosign) и провенанс (D7) — туда же, позже.
