name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Только чтение — ни одна из джоб этого workflow не пишет в репозиторий
# (fmt/clippy/test/build), в отличие от release.yml, где publish отдельно
# поднимает права до contents: write только там, где это реально нужно.
permissions:
  contents: read

jobs:
  rust:
    name: Rust · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace

  bootstrap:
    name: Bootstrap (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: bootstrap/package-lock.json
      - name: install (без postinstall — dist ещё не собран)
        working-directory: bootstrap
        run: npm install --ignore-scripts
      - name: build
        working-directory: bootstrap
        run: npm run build
      - name: test
        working-directory: bootstrap
        run: npm test

# Этот workflow — только проверка кода на push/PR (fmt/clippy/test).
# Сборка платформенных артефактов (D1) — release.yml, запускается публикацией
# релиза. Подпись (D2, sigstore/cosign) и провенанс (D7) — туда же, позже.
